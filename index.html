<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bitácora de Obra – Plataforma de control de proyecto</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#FFFFFF; --surface:#F4F6F9; --surface-2:#E9EDF3; --line:#DCE1E8; --line-strong:#C3CAD5;
  --ink:#10153A; --ink-2:#2B3150; --muted:#5B6478;
  --brand:#0003AA; --brand-2:#2A2FD1; --brand-soft:#E8E9FB; --on-brand:#FFFFFF;
  --red:#F22230; --red-soft:#FDE8EA; --amber:#D99A00; --amber-ink:#8A5F00; --amber-soft:#FFF4D4;
  --ok:#0E8A5F; --ok-soft:#E1F4EC;
  --shadow:0 10px 30px rgba(16,21,58,.12);
  --r-s:6px; --r-m:10px; --r-l:16px;
  --font:'Outfit', 'Segoe UI', system-ui, -apple-system, Roboto, Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C0F22; --surface:#141933; --surface-2:#1B2142; --line:#272E52; --line-strong:#3A4370;
    --ink:#E9EBF8; --ink-2:#C9CDE6; --muted:#9AA1C0;
    --brand:#7B80FF; --brand-2:#9A9EFF; --brand-soft:#1E2358; --on-brand:#0C0F22;
    --red:#FF5C68; --red-soft:#3A1520; --amber:#FFC23D; --amber-ink:#FFD57A; --amber-soft:#382C0E;
    --ok:#3DD39B; --ok-soft:#0F3328; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C0F22; --surface:#141933; --surface-2:#1B2142; --line:#272E52; --line-strong:#3A4370;
  --ink:#E9EBF8; --ink-2:#C9CDE6; --muted:#9AA1C0;
  --brand:#7B80FF; --brand-2:#9A9EFF; --brand-soft:#1E2358; --on-brand:#0C0F22;
  --red:#FF5C68; --red-soft:#3A1520; --amber:#FFC23D; --amber-ink:#FFD57A; --amber-soft:#382C0E;
  --ok:#3DD39B; --ok-soft:#0F3328; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme: dark;
}
:root{ box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
html{ scroll-padding-top:env(safe-area-inset-top,0px); }
*,*::before,*::after{ box-sizing:inherit; }
html,body{ margin:0; background:var(--bg); color:var(--ink); font-family:var(--font); font-size:15px; line-height:1.5; -webkit-font-smoothing:antialiased; }
body{ min-height:100%; }
img,video{ max-width:100%; display:block; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:2px solid var(--brand); outline-offset:2px; border-radius:4px; }
.num{ font-variant-numeric:tabular-nums; }
.sr{ position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); }
@media (prefers-reduced-motion: reduce){ *{ animation:none!important; transition:none!important; } }

/* ---------- Layout ---------- */
.app{ display:grid; grid-template-columns:264px minmax(0,1fr); min-height:100vh; }
.rail{ position:sticky; top:env(safe-area-inset-top,0px); height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:18px; padding:22px 18px; border-right:1px solid var(--line); background:var(--bg); overflow-y:auto; }
.brand{ display:flex; align-items:center; gap:10px; }
.brand-mark{ width:34px; height:34px; border-radius:8px; background:var(--brand); display:grid; place-items:center; flex:none; }
.brand-mark svg{ width:20px; height:20px; }
.brand-name{ font-weight:700; font-size:17px; letter-spacing:-.01em; line-height:1.1; }
.brand-sub{ font-size:12px; color:var(--muted); }
.proj-card{ text-align:left; width:100%; border:1px solid var(--line); background:var(--surface); border-radius:var(--r-m); padding:12px 13px; display:grid; gap:6px; }
.proj-card:hover{ border-color:var(--line-strong); }
.proj-card .pc-label{ font-size:12px; color:var(--muted); display:flex; justify-content:space-between; }
.proj-card .pc-name{ font-weight:600; font-size:14px; line-height:1.25; }
.timebar{ height:6px; background:var(--surface-2); border-radius:3px; overflow:hidden; }
.timebar span{ display:block; height:100%; background:var(--brand); border-radius:3px; }
.pc-week{ font-size:12px; color:var(--muted); }
.nav{ display:grid; gap:2px; }
.nav button{ display:flex; align-items:center; gap:11px; width:100%; padding:9px 11px; border:0; background:transparent; border-radius:8px; text-align:left; font-weight:500; color:var(--ink-2); }
.nav button svg{ width:19px; height:19px; flex:none; opacity:.8; }
.nav button:hover{ background:var(--surface); }
.nav button[aria-current="page"]{ background:var(--brand-soft); color:var(--brand); font-weight:600; }
.nav button[aria-current="page"] svg{ opacity:1; }
.nav .badge{ margin-left:auto; }
.badge{ font-size:11.5px; font-weight:600; padding:1px 7px; border-radius:20px; background:var(--surface-2); color:var(--muted); }
.badge.red{ background:var(--red); color:#fff; }
.btn-new{ display:flex; align-items:center; justify-content:center; gap:8px; width:100%; padding:12px; border:0; border-radius:var(--r-m); background:var(--brand); color:var(--on-brand); font-weight:600; font-size:15px; }
.btn-new:hover{ background:var(--brand-2); }
.rail-foot{ margin-top:auto; display:grid; gap:10px; }
.session{ border-top:1px solid var(--line); padding-top:14px; display:flex; align-items:center; gap:10px; }
.avatar{ width:34px; height:34px; border-radius:50%; background:var(--ink); color:var(--bg); display:grid; place-items:center; font-weight:600; font-size:13px; flex:none; }
.session .who{ font-size:13px; line-height:1.25; min-width:0; }
.session .who b{ display:block; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.session .who span{ color:var(--muted); }
.link-btn{ border:0; background:none; color:var(--brand); font-weight:500; padding:0; font-size:13px; }
.sync{ font-size:12px; color:var(--muted); display:flex; align-items:center; gap:7px; }
.sync i{ width:8px; height:8px; border-radius:50%; background:var(--ok); flex:none; }
.sync.local i{ background:var(--amber); }

main{ min-width:0; padding:28px clamp(16px,3.2vw,44px) 120px; }
.view{ max-width:1180px; margin:0 auto; }
.topbar{ display:none; }
.tabbar{ display:none; }
.fab{ display:none; }

@media (max-width: 900px){
  .app{ grid-template-columns:1fr; }
  .rail{ display:none; }
  main{ padding:14px 14px 150px; }
  .topbar{ display:flex; align-items:center; gap:10px; position:sticky; top:env(safe-area-inset-top,0px); z-index:20; background:var(--bg); padding:10px 14px; border-bottom:1px solid var(--line); }
  .topbar .t-proj{ flex:1; min-width:0; text-align:left; border:0; background:none; padding:0; }
  .topbar .t-proj b{ display:block; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .topbar .t-proj span{ font-size:12px; color:var(--muted); }
  .tabbar{ display:grid; grid-template-columns:repeat(5,1fr); position:fixed; left:0; right:0; bottom:0; z-index:30; background:var(--bg); border-top:1px solid var(--line); padding-bottom:env(safe-area-inset-bottom,0px); }
  .tabbar button{ border:0; background:none; display:grid; justify-items:center; gap:2px; padding:8px 2px 9px; font-size:11px; color:var(--muted); font-weight:500; }
  .tabbar button svg{ width:21px; height:21px; }
  .tabbar button[aria-current="page"]{ color:var(--brand); font-weight:600; }
  .fab{ display:flex; align-items:center; gap:8px; position:fixed; right:16px; bottom:calc(72px + env(safe-area-inset-bottom,0px)); z-index:31; border:0; border-radius:28px; background:var(--brand); color:var(--on-brand); font-weight:600; padding:14px 20px; box-shadow:var(--shadow); }
}

/* ---------- Generic pieces ---------- */
h1,h2,h3{ margin:0; letter-spacing:-.015em; }
.v-head{ display:flex; flex-wrap:wrap; align-items:flex-end; justify-content:space-between; gap:14px; margin-bottom:20px; }
.v-head h1{ font-size:clamp(26px,3.2vw,34px); font-weight:700; line-height:1.1; }
.v-head p{ margin:6px 0 0; color:var(--muted); max-width:62ch; }
.section-title{ font-size:17px; font-weight:600; margin-bottom:12px; display:flex; align-items:baseline; justify-content:space-between; gap:10px; }
.section-title small{ font-size:13px; font-weight:400; color:var(--muted); }
.btn{ display:inline-flex; align-items:center; gap:7px; border:1px solid var(--line-strong); background:var(--bg); padding:8px 13px; border-radius:8px; font-weight:500; font-size:14px; }
.btn:hover{ background:var(--surface); }
.btn svg{ width:16px; height:16px; }
.btn.primary{ background:var(--brand); border-color:var(--brand); color:var(--on-brand); }
.btn.primary:hover{ background:var(--brand-2); }
.btn.ghost{ border-color:transparent; background:transparent; }
.btn.ghost:hover{ background:var(--surface); }
.btn.danger{ color:var(--red); }
.btn.sm{ padding:5px 9px; font-size:13px; }
.btn:disabled{ opacity:.5; cursor:not-allowed; }
.seg{ display:inline-flex; background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:3px; gap:2px; flex-wrap:wrap; }
.seg button{ border:0; background:transparent; padding:6px 12px; border-radius:6px; font-size:13.5px; font-weight:500; color:var(--muted); }
.seg button[aria-pressed="true"]{ background:var(--bg); color:var(--ink); box-shadow:0 1px 2px rgba(16,21,58,.12); font-weight:600; }
.chip{ display:inline-flex; align-items:center; gap:6px; border:1px solid var(--line); background:var(--bg); border-radius:20px; padding:5px 11px; font-size:13px; font-weight:500; color:var(--ink-2); white-space:nowrap; }
.chip[aria-pressed="true"]{ border-color:var(--brand); background:var(--brand-soft); color:var(--brand); }
.chip .dot{ width:8px; height:8px; border-radius:50%; }
.empty{ border:1.5px dashed var(--line-strong); border-radius:var(--r-l); padding:38px 22px; text-align:center; color:var(--muted); }
.empty h3{ color:var(--ink); font-size:18px; margin-bottom:6px; }
.empty .acts{ display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin-top:16px; }
.field{ display:grid; gap:6px; }
.field > label, .lbl{ font-size:13px; font-weight:600; color:var(--ink-2); }
.field .hint{ font-size:12px; color:var(--muted); font-weight:400; }
.input, select.input, textarea.input{ width:100%; border:1px solid var(--line-strong); background:var(--bg); border-radius:8px; padding:10px 12px; font-size:15px; }
textarea.input{ min-height:110px; resize:vertical; line-height:1.5; }
.input:focus{ outline:2px solid var(--brand); outline-offset:-1px; border-color:var(--brand); }
.search{ position:relative; flex:1 1 260px; }
.search svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); width:17px; height:17px; color:var(--muted); }
.search input{ padding-left:36px; }
mark{ background:var(--amber-soft); color:inherit; border-bottom:2px solid var(--amber); padding:0 1px; border-radius:2px; }

/* ---------- Resumen ---------- */
.hero{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:20px 32px; align-items:end; padding-bottom:22px; border-bottom:1px solid var(--line); }
.hero .h-kicker{ color:var(--muted); font-size:14px; display:flex; gap:14px; flex-wrap:wrap; }
.hero h1{ font-size:clamp(28px,4.2vw,46px); font-weight:700; line-height:1.04; letter-spacing:-.025em; margin-top:6px; max-width:22ch; }
.hero .h-week{ text-align:right; }
.hero .h-week .big{ font-size:clamp(46px,6vw,72px); font-weight:800; line-height:.9; letter-spacing:-.04em; color:var(--brand); }
.hero .h-week .big small{ font-size:.38em; color:var(--muted); font-weight:600; letter-spacing:0; }
.hero .h-week .lbl2{ font-size:13px; color:var(--muted); margin-top:6px; }
.strip-wrap{ margin:24px 0 8px; }
.strip-head{ display:flex; justify-content:space-between; align-items:baseline; gap:12px; flex-wrap:wrap; margin-bottom:10px; }
.strip-head h2{ font-size:17px; font-weight:600; }
.legend{ display:flex; gap:14px; flex-wrap:wrap; font-size:12.5px; color:var(--muted); }
.legend span{ display:inline-flex; align-items:center; gap:6px; }
.legend i{ width:10px; height:10px; border-radius:2px; display:inline-block; }
.strip{ overflow-x:auto; padding-bottom:6px; }
.strip-cols{ display:flex; align-items:stretch; gap:3px; min-width:100%; height:170px; }
.wk{ flex:1 0 14px; min-width:14px; position:relative; border:0; padding:0; background:transparent; display:flex; flex-direction:column; justify-content:flex-end; align-items:stretch; border-radius:4px; }
.wk .wk-track{ position:relative; flex:1; display:flex; flex-direction:column; justify-content:flex-end; border-radius:4px; }
.wk.future .wk-track{ background:repeating-linear-gradient(135deg, var(--surface-2) 0 3px, transparent 3px 7px); }
.wk .wk-bar{ background:var(--brand); border-radius:3px 3px 1px 1px; display:flex; flex-direction:column; justify-content:flex-start; overflow:hidden; }
.wk .wk-bar .al{ background:var(--red); width:100%; }
.wk .wk-star{ position:absolute; left:50%; transform:translateX(-50%); color:var(--amber); font-size:15px; line-height:1; text-shadow:0 0 0 var(--bg); }
.wk .wk-lbl{ height:20px; font-size:11px; color:var(--muted); text-align:left; white-space:nowrap; padding-top:5px; }
.wk:hover .wk-track{ background-color:var(--surface); }
.wk.now .wk-track{ outline:2px solid var(--ink); outline-offset:1px; }
.wk.selected .wk-track{ background:var(--brand-soft); }
.strip-foot{ display:flex; justify-content:space-between; font-size:12px; color:var(--muted); margin-top:2px; }
.kpis{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); border:1px solid var(--line); border-radius:var(--r-l); margin:22px 0 28px; overflow:hidden; }
.kpi{ padding:16px 18px; border-right:1px solid var(--line); min-width:0; }
.kpi:last-child{ border-right:0; }
.kpi .k-l{ font-size:13px; color:var(--muted); }
.kpi .k-v{ font-size:30px; font-weight:700; letter-spacing:-.02em; line-height:1.15; margin-top:4px; }
.kpi .k-v small{ font-size:14px; font-weight:500; color:var(--muted); margin-left:3px; letter-spacing:0; }
.kpi .k-s{ font-size:12.5px; color:var(--muted); margin-top:3px; }
.kpi.alert .k-v{ color:var(--red); }
.kpi .mini{ height:5px; background:var(--surface-2); border-radius:3px; margin-top:8px; overflow:hidden; }
.kpi .mini span{ display:block; height:100%; background:var(--brand); }
@media (max-width:1100px){ .kpis{ grid-template-columns:repeat(3,minmax(0,1fr)); } .kpi:nth-child(3){ border-right:0; } .kpi:nth-child(n+4){ border-top:1px solid var(--line); } }
@media (max-width:620px){ .kpis{ grid-template-columns:repeat(2,minmax(0,1fr)); } .kpi{ border-right:1px solid var(--line)!important; border-top:1px solid var(--line); } .kpi:nth-child(-n+2){ border-top:0; } .kpi:nth-child(2n){ border-right:0!important; } .kpi:last-child{ grid-column:span 2; } .hero{ grid-template-columns:1fr; } .hero .h-week{ text-align:left; } }
.two{ display:grid; grid-template-columns:minmax(0,1.45fr) minmax(0,1fr); gap:28px; }
@media (max-width:980px){ .two{ grid-template-columns:1fr; } }
.hito-mini{ display:grid; grid-template-columns:112px minmax(0,1fr); gap:14px; padding:12px 0; border-top:1px solid var(--line); text-align:left; background:none; border-left:0; border-right:0; border-bottom:0; width:100%; }
.hito-mini:first-of-type{ border-top:0; }
.hito-mini .thumb{ width:112px; aspect-ratio:4/3; border-radius:8px; background:var(--surface-2); overflow:hidden; display:grid; place-items:center; color:var(--amber); font-size:26px; }
.hito-mini .thumb img{ width:100%; height:100%; object-fit:cover; }
.hito-mini .when{ font-size:12.5px; color:var(--muted); }
.hito-mini h4{ margin:2px 0 3px; font-size:15.5px; line-height:1.3; }
.hito-mini p{ margin:0; font-size:13.5px; color:var(--ink-2); display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.alert-box{ border:1px solid var(--line); border-left:4px solid var(--red); border-radius:var(--r-m); padding:12px 14px; margin-bottom:10px; }
.alert-box .when{ font-size:12.5px; color:var(--muted); }
.alert-box h4{ font-size:14.5px; margin:2px 0 4px; }
.alert-box p{ margin:0 0 8px; font-size:13.5px; color:var(--ink-2); }
.ok-box{ border:1px solid var(--line); border-radius:var(--r-m); padding:16px; color:var(--muted); font-size:14px; display:flex; gap:10px; align-items:center; }
.ok-box i{ width:10px; height:10px; border-radius:50%; background:var(--ok); }
.sk{ background:var(--surface-2); border-radius:6px; display:block; }
.sk-line{ display:block; height:10px; border-radius:5px; background:var(--surface-2); margin:7px 0; }
.ghost:not(.btn){ pointer-events:none; }
.ghost-note{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; border:1.5px dashed var(--line-strong); border-radius:var(--r-m); padding:12px 14px; color:var(--muted); font-size:13.5px; margin-bottom:14px; }
.ghost-note b{ color:var(--ink-2); font-weight:600; }
.ghost-note .btn{ margin-left:auto; }
.ph{ color:var(--muted); opacity:.75; }
.ph-title{ border:0; background:none; padding:0; font:inherit; color:var(--muted); opacity:.55; text-align:left; border-bottom:3px dashed var(--line-strong); cursor:pointer; letter-spacing:inherit; }
.ph-title:hover{ opacity:.8; }
.kpi .k-v.ph-v{ color:var(--line-strong); }
.ghost-chart{ border-left:1px solid var(--line); border-bottom:1px solid var(--line); margin-left:28px; }
.ghost-chart .gc-bars{ position:absolute; inset:16px 10px 0 10px; display:flex; align-items:flex-end; gap:5%; }
.ghost-chart .gc-bars span{ flex:1; background:var(--surface-2); border-radius:4px 4px 0 0; }
.ghost-chart .gc-line{ position:absolute; inset:0; width:100%; height:100%; }
.ghost-chart .gc-note{ position:absolute; left:50%; top:45%; transform:translate(-50%,-50%); background:var(--bg); border:1px solid var(--line); border-radius:20px; padding:6px 14px; font-size:13px; color:var(--muted); white-space:nowrap; max-width:90%; overflow:hidden; text-overflow:ellipsis; }
.ghost-hbars{ position:absolute; inset:10px 10px 10px 0; display:grid; gap:12px; align-content:center; }
.ghost-hbars span{ height:22px; background:var(--surface-2); border-radius:0 4px 4px 0; }
.ghost .tl-card::before{ color:var(--line-strong); }
.wk .wk-track{ border-bottom:2px solid var(--line); }
.g-ghost{ aspect-ratio:4/3; border-radius:10px; background:var(--surface-2); display:grid; place-items:center; color:var(--line-strong); font-size:28px; }
.today-line{ font-size:14px; color:var(--ink-2); padding:14px 16px; background:var(--surface); border-radius:var(--r-m); margin-bottom:12px; }

/* ---------- Bitácora ---------- */
.toolbar{ display:grid; gap:12px; padding:14px; border:1px solid var(--line); border-radius:var(--r-l); background:var(--surface); margin-bottom:16px; }
.tb-row{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; }
.period-nav{ display:flex; align-items:center; gap:6px; background:var(--bg); border:1px solid var(--line); border-radius:9px; padding:3px; }
.period-nav button{ border:0; background:transparent; width:32px; height:32px; border-radius:6px; display:grid; place-items:center; }
.period-nav button:hover{ background:var(--surface); }
.period-nav .pl{ min-width:190px; text-align:center; padding:0 4px; line-height:1.15; }
.period-nav .pl b{ display:block; font-size:14px; }
.period-nav .pl span{ font-size:12px; color:var(--muted); }
.chips{ display:flex; gap:6px; flex-wrap:wrap; }
.result-line{ display:flex; flex-wrap:wrap; justify-content:space-between; align-items:center; gap:10px; margin:6px 0 14px; }
.result-line .rl-text{ font-size:14px; color:var(--ink-2); }
.result-line .rl-text b{ color:var(--ink); }
.feed{ position:relative; }
.day{ margin-bottom:8px; }
.day-head{ position:sticky; top:calc(env(safe-area-inset-top,0px)); z-index:5; background:var(--bg); padding:10px 0 8px; display:flex; align-items:baseline; gap:12px; border-bottom:1px solid var(--line); }
@media (max-width:900px){ .day-head{ top:calc(env(safe-area-inset-top,0px) + 57px); } }
.day-head .dn{ font-size:28px; font-weight:700; letter-spacing:-.03em; line-height:1; min-width:36px; }
.day-head .dt{ font-weight:600; font-size:15px; }
.day-head .dt span{ display:block; font-size:12px; font-weight:400; color:var(--muted); }
.day-head .dc{ margin-left:auto; font-size:12.5px; color:var(--muted); }
.entries{ position:relative; padding:6px 0 6px 26px; }
.entries::before{ content:""; position:absolute; left:8px; top:0; bottom:0; width:2px; background:var(--line); }
.entry{ position:relative; padding:14px 0 14px; border-bottom:1px solid var(--line); }

.entry::before{ content:""; position:absolute; left:-23px; top:20px; width:12px; height:12px; border-radius:50%; background:var(--cat,var(--brand)); box-shadow:0 0 0 3px var(--bg); }
.entry.is-hito::before{ content:"★"; width:auto; height:auto; background:none; color:var(--amber); font-size:19px; left:-26px; top:11px; box-shadow:none; line-height:1; }
.entry.is-hito{ background:linear-gradient(90deg, var(--amber-soft), transparent 70%); margin-left:-12px; padding-left:12px; border-radius:8px; }
.e-meta{ display:flex; flex-wrap:wrap; align-items:center; gap:6px 10px; font-size:12.5px; color:var(--muted); }
.e-cat{ display:inline-flex; align-items:center; gap:5px; font-weight:600; color:var(--ink-2); }
.tag-hito{ background:var(--amber); color:#1d1500; font-weight:700; font-size:11.5px; padding:1px 8px; border-radius:20px; }
.tag-alert{ background:var(--red-soft); color:var(--red); font-weight:600; font-size:11.5px; padding:1px 8px; border-radius:20px; }
.tag-ok{ background:var(--ok-soft); color:var(--ok); font-weight:600; font-size:11.5px; padding:1px 8px; border-radius:20px; }
.entry h3{ font-size:16px; margin:6px 0 2px; line-height:1.3; font-weight:600; }
.entry .e-text{ margin:4px 0 0; color:var(--ink-2); white-space:pre-wrap; max-width:78ch; font-size:14.5px; }
.metrics{ display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
.metric{ font-size:12.5px; background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:2px 8px; color:var(--ink-2); }
.metric b{ font-weight:600; color:var(--ink); }
.thumbs{ display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
.thumbs button{ border:0; padding:0; width:96px; height:72px; border-radius:7px; overflow:hidden; background:var(--surface-2); display:grid; place-items:center; color:var(--muted); font-size:11px; }
.thumbs img,.thumbs video{ width:100%; height:100%; object-fit:cover; }
.thumbs .doc{ display:grid; gap:2px; justify-items:center; padding:4px; text-align:center; line-height:1.15; }
.e-foot{ display:flex; flex-wrap:wrap; align-items:center; gap:6px; margin-top:10px; }
.e-foot .author{ font-size:12.5px; color:var(--muted); margin-right:auto; }
.e-foot .author b{ color:var(--ink-2); font-weight:600; }
.hist{ margin-top:8px; font-size:12.5px; color:var(--muted); border-left:2px solid var(--line); padding-left:10px; display:grid; gap:2px; }
.ai-panel{ border:1px solid var(--brand); border-radius:var(--r-l); padding:16px 18px; margin-bottom:18px; background:var(--brand-soft); }
.ai-panel .ai-h{ display:flex; justify-content:space-between; gap:10px; align-items:center; margin-bottom:8px; font-weight:600; color:var(--brand); }
.ai-panel .ai-body{ font-size:14.5px; color:var(--ink); max-width:80ch; }

/* ---------- Hitos ---------- */
.month-chips{ display:flex; gap:6px; overflow-x:auto; padding-bottom:4px; margin-bottom:22px; }
.tl-month{ margin-bottom:26px; }
.tl-month > h2{ font-size:22px; font-weight:700; margin-bottom:10px; display:flex; align-items:baseline; gap:10px; }
.tl-month > h2 small{ font-size:13px; color:var(--muted); font-weight:500; }
.tl-item{ display:grid; grid-template-columns:76px minmax(0,1fr); gap:18px; position:relative; padding-bottom:22px; }
.tl-item::before{ content:""; position:absolute; left:94px; top:30px; bottom:0; width:2px; background:var(--line); }
.tl-item:last-child::before{ display:none; }
.tl-date{ text-align:right; padding-top:2px; }
.tl-date b{ display:block; font-size:30px; line-height:1; font-weight:800; letter-spacing:-.03em; }
.tl-date span{ font-size:12px; color:var(--muted); }
.tl-card{ position:relative; padding-left:26px; }
.tl-card::before{ content:"★"; position:absolute; left:-11px; top:0; color:var(--amber); font-size:22px; line-height:1; background:var(--bg); }
.tl-card .when{ font-size:12.5px; color:var(--muted); }
.tl-card h3{ font-size:19px; margin:3px 0 6px; line-height:1.25; }
.tl-card p{ margin:0; color:var(--ink-2); max-width:72ch; white-space:pre-wrap; }
.tl-photos{ display:grid; grid-template-columns:repeat(auto-fill,minmax(180px,1fr)); gap:8px; margin-top:12px; max-width:760px; }
.tl-photos button{ border:0; padding:0; aspect-ratio:4/3; border-radius:10px; overflow:hidden; background:var(--surface-2); }
.tl-photos img,.tl-photos video{ width:100%; height:100%; object-fit:cover; }
.tl-photos button:first-child:nth-last-child(1){ grid-column:1/-1; aspect-ratio:16/8; }
@media (max-width:620px){ .tl-item{ grid-template-columns:48px minmax(0,1fr); gap:12px; } .tl-item::before{ left:60px; } .tl-date b{ font-size:22px; } }

/* ---------- Evidencias ---------- */
.gallery{ display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:12px; }
.g-item{ border:0; padding:0; background:none; text-align:left; display:grid; gap:6px; }
.g-item .g-img{ aspect-ratio:4/3; border-radius:10px; overflow:hidden; background:var(--surface-2); position:relative; display:grid; place-items:center; color:var(--muted); }
.g-item img,.g-item video{ width:100%; height:100%; object-fit:cover; }
.g-item .g-star{ position:absolute; top:8px; left:8px; background:var(--amber); color:#1d1500; font-size:11px; font-weight:700; border-radius:20px; padding:1px 8px; }
.g-item .g-cap{ font-size:13px; line-height:1.3; }
.g-item .g-cap span{ display:block; font-size:12px; color:var(--muted); }

/* ---------- Estadísticas ---------- */
.charts{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
.chart-card{ border:1px solid var(--line); border-radius:var(--r-l); padding:16px 18px; min-width:0; }
.chart-card.wide{ grid-column:1/-1; }
.chart-card .cc-take{ font-size:16px; font-weight:600; line-height:1.3; }
.chart-card .cc-sub{ font-size:12.5px; color:var(--muted); margin:2px 0 12px; }
.chart-box{ position:relative; height:250px; }
@media (max-width:900px){ .charts{ grid-template-columns:1fr; } }
.heat{ overflow-x:auto; }
.heat-grid{ display:grid; grid-auto-flow:column; grid-template-rows:repeat(7,14px); gap:3px; width:max-content; }
.heat-grid span{ width:14px; height:14px; border-radius:3px; background:var(--surface-2); }
.heat-grid span.l1{ background:color-mix(in srgb, var(--brand) 30%, var(--bg)); }
.heat-grid span.l2{ background:color-mix(in srgb, var(--brand) 60%, var(--bg)); }
.heat-grid span.l3{ background:var(--brand); }
.heat-grid span.out{ background:transparent; }
.heat-grid span.h{ box-shadow:inset 0 0 0 2px var(--amber); }
.heat-wrap{ display:flex; gap:8px; }
.heat-days{ display:grid; grid-template-rows:repeat(7,14px); gap:3px; font-size:10.5px; color:var(--muted); line-height:14px; }

/* ---------- Modal / composer ---------- */
.overlay{ position:fixed; inset:0; z-index:100; background:rgba(10,13,35,.5); display:flex; justify-content:flex-end; }
.sheet{ width:min(640px,100%); height:100%; background:var(--bg); display:flex; flex-direction:column; box-shadow:var(--shadow); }
.sheet.anim{ animation:slideIn .22s ease-out; }
@keyframes slideIn{ from{ transform:translateX(30px); opacity:.4; } to{ transform:none; opacity:1; } }
.sheet-head{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:calc(16px + env(safe-area-inset-top,0px)) 22px 14px; border-bottom:1px solid var(--line); }
.sheet-head h2{ font-size:20px; }
.sheet-body{ flex:1; overflow-y:auto; padding:20px 22px; display:grid; gap:20px; align-content:start; }
.sheet-foot{ display:flex; gap:10px; justify-content:flex-end; align-items:center; padding:14px 22px calc(14px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--line); background:var(--bg); }
.sheet-foot .who-saves{ margin-right:auto; font-size:12.5px; color:var(--muted); }
.x-btn{ border:0; background:var(--surface); width:36px; height:36px; border-radius:50%; display:grid; place-items:center; }
.kind{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.kind button{ border:1.5px solid var(--line-strong); background:var(--bg); border-radius:12px; padding:13px 14px; text-align:left; display:grid; gap:3px; }
.kind button b{ font-size:15px; display:flex; align-items:center; gap:7px; }
.kind button span{ font-size:12.5px; color:var(--muted); line-height:1.35; }
.kind button[aria-pressed="true"]{ border-color:var(--brand); background:var(--brand-soft); }
.kind button.k-hito[aria-pressed="true"]{ border-color:var(--amber); background:var(--amber-soft); }
.kind button.k-hito b i{ color:var(--amber); font-style:normal; }
.cat-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(132px,1fr)); gap:7px; }
.cat-grid button{ border:1px solid var(--line); background:var(--bg); border-radius:9px; padding:9px 10px; display:flex; align-items:center; gap:8px; text-align:left; font-size:13.5px; font-weight:500; }
.cat-grid button .ci{ font-size:17px; }
.cat-grid button[aria-pressed="true"]{ border-color:var(--cat); box-shadow:inset 0 0 0 1px var(--cat); background:color-mix(in srgb, var(--cat) 10%, var(--bg)); }
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.row3{ display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
@media (max-width:520px){ .row3{ grid-template-columns:1fr 1fr; } }
details.more{ border:1px solid var(--line); border-radius:var(--r-m); padding:0 14px; }
details.more summary{ cursor:pointer; padding:12px 0; font-weight:600; font-size:14px; list-style:none; display:flex; justify-content:space-between; }
details.more summary::after{ content:"+"; color:var(--muted); font-weight:400; font-size:18px; line-height:1; }
details.more[open] summary::after{ content:"–"; }
details.more .more-body{ display:grid; gap:12px; padding-bottom:14px; }
.weather{ display:flex; gap:6px; flex-wrap:wrap; }
.drop{ border:1.5px dashed var(--line-strong); border-radius:var(--r-m); padding:18px; text-align:center; color:var(--muted); font-size:14px; display:grid; gap:8px; justify-items:center; }
.drop.over{ border-color:var(--brand); background:var(--brand-soft); }
.drop .acts{ display:flex; gap:8px; flex-wrap:wrap; justify-content:center; }
.att-list{ display:flex; flex-wrap:wrap; gap:8px; }
.att{ position:relative; width:92px; height:70px; border-radius:7px; overflow:hidden; background:var(--surface-2); display:grid; place-items:center; font-size:11px; color:var(--muted); text-align:center; }
.att img,.att video{ width:100%; height:100%; object-fit:cover; }
.att .rm{ position:absolute; top:3px; right:3px; width:22px; height:22px; border-radius:50%; border:0; background:rgba(10,13,35,.75); color:#fff; font-size:13px; line-height:1; }
.check{ display:flex; gap:10px; align-items:flex-start; border:1px solid var(--line); border-radius:var(--r-m); padding:12px 14px; cursor:pointer; }
.check input{ width:18px; height:18px; margin-top:2px; accent-color:var(--red); }
.check b{ display:block; font-size:14px; }
.check span{ font-size:12.5px; color:var(--muted); }
.err{ color:var(--red); font-size:13px; }
.dialog{ margin:auto; width:min(520px,calc(100% - 28px)); background:var(--bg); border-radius:var(--r-l); box-shadow:var(--shadow); max-height:calc(100% - 40px); display:flex; flex-direction:column; }
.dialog .sheet-head{ padding-top:16px; }
.overlay.center{ justify-content:center; align-items:center; }

/* Lightbox */
.lb{ position:fixed; inset:0; z-index:120; background:rgba(5,7,20,.92); display:grid; grid-template-rows:auto 1fr auto; color:#fff; padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px); }
.lb-top{ display:flex; justify-content:space-between; align-items:center; padding:12px 16px; gap:10px; }
.lb-top .x-btn{ background:rgba(255,255,255,.12); color:#fff; }
.lb-stage{ display:grid; grid-template-columns:48px 1fr 48px; align-items:center; min-height:0; }
.lb-stage .media{ display:grid; place-items:center; height:100%; min-height:0; padding:0 6px; }
.lb-stage img,.lb-stage video{ max-height:calc(100vh - 190px); max-width:100%; object-fit:contain; border-radius:6px; }
.lb-stage .nav-a{ border:0; background:rgba(255,255,255,.1); color:#fff; width:40px; height:40px; border-radius:50%; justify-self:center; font-size:18px; }
.lb-cap{ padding:12px 18px 18px; max-width:860px; margin:0 auto; text-align:center; font-size:14px; color:#d7daf0; }
.lb-cap b{ color:#fff; display:block; font-size:15px; }
.lb-cap button{ margin-top:8px; background:rgba(255,255,255,.12); color:#fff; border:0; }

/* Toast + loader */
#toast-root{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(24px + env(safe-area-inset-bottom,0px)); z-index:200; display:grid; gap:8px; justify-items:center; pointer-events:none; }
@media (max-width:900px){ #toast-root{ bottom:calc(140px + env(safe-area-inset-bottom,0px)); } }
.toast{ background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; font-size:14px; box-shadow:var(--shadow); max-width:90vw; }
.toast.err{ background:var(--red); color:#fff; }
.loader{ display:grid; place-items:center; min-height:60vh; color:var(--muted); gap:12px; text-align:center; }
.spin{ width:28px; height:28px; border:3px solid var(--line); border-top-color:var(--brand); border-radius:50%; animation:sp 0.8s linear infinite; }
@keyframes sp{ to{ transform:rotate(360deg); } }
.banner{ display:flex; gap:12px; align-items:center; flex-wrap:wrap; border:1px solid var(--line); background:var(--surface); border-radius:var(--r-m); padding:12px 14px; margin-bottom:18px; font-size:14px; }
.banner b{ font-weight:600; }
.banner .b-acts{ margin-left:auto; display:flex; gap:8px; }
.progress{ height:6px; background:var(--surface-2); border-radius:3px; overflow:hidden; width:220px; }
.progress span{ display:block; height:100%; background:var(--brand); transition:width .2s; }

/* ================= v2: plataforma de control de obra ================= */
.nav-group{ font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); padding:12px 11px 4px; }
.nav{ gap:1px; }
.nav button{ padding:8px 11px; }
.subtabs{ display:flex; gap:4px; border-bottom:1px solid var(--line); margin-bottom:18px; overflow-x:auto; }
.subtabs button{ border:0; background:none; padding:10px 14px; font-weight:500; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; }
.subtabs button[aria-pressed="true"]{ color:var(--brand); border-bottom-color:var(--brand); font-weight:600; }
.grid2{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
.grid3{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:18px; }
@media (max-width:980px){ .grid2,.grid3{ grid-template-columns:1fr; } }
.card{ border:1px solid var(--line); border-radius:var(--r-l); padding:16px 18px; min-width:0; background:var(--bg); }
.card h3{ font-size:16px; font-weight:600; margin-bottom:2px; }
.card .sub{ font-size:12.5px; color:var(--muted); margin-bottom:12px; }
.kpis.k6{ grid-template-columns:repeat(6,minmax(0,1fr)); }
@media (max-width:1250px){ .kpis.k6{ grid-template-columns:repeat(3,minmax(0,1fr)); } .kpis.k6 .kpi:nth-child(3){ border-right:0; } .kpis.k6 .kpi:nth-child(n+4){ border-top:1px solid var(--line); } }
@media (max-width:620px){ .kpis.k6{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
.kpi .k-v.good{ color:var(--ok); } .kpi .k-v.bad{ color:var(--red); } .kpi .k-v.warn{ color:var(--amber-ink); }
.k-info{ border:0; background:none; color:var(--muted); font-size:12px; padding:0 0 0 4px; cursor:help; }
/* tablas */
.tbl-wrap{ overflow-x:auto; border:1px solid var(--line); border-radius:var(--r-m); }
.tbl{ width:100%; border-collapse:collapse; font-size:13.5px; }
.tbl th{ text-align:left; font-weight:600; font-size:12px; color:var(--muted); background:var(--surface); padding:9px 10px; border-bottom:1px solid var(--line); white-space:nowrap; position:sticky; top:0; }
.tbl td{ padding:8px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
.tbl tr:last-child td{ border-bottom:0; }
.tbl td.n, .tbl th.n{ text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap; }
.tbl tr.grp td{ background:var(--surface); font-weight:600; font-size:12.5px; color:var(--ink-2); }
.tbl tr.click{ cursor:pointer; } .tbl tr.click:hover td{ background:var(--brand-soft); }
.pill{ display:inline-block; font-size:11.5px; font-weight:600; padding:1px 8px; border-radius:20px; white-space:nowrap; }
.pill.ok{ background:var(--ok-soft); color:var(--ok); } .pill.bad{ background:var(--red-soft); color:var(--red); }
.pill.warn{ background:var(--amber-soft); color:var(--amber-ink); } .pill.mut{ background:var(--surface-2); color:var(--muted); }
.pill.blue{ background:var(--brand-soft); color:var(--brand); }
.bar-in{ height:6px; background:var(--surface-2); border-radius:3px; overflow:hidden; min-width:70px; position:relative; }
.bar-in span{ display:block; height:100%; background:var(--brand); }
.bar-in i{ position:absolute; top:-2px; bottom:-2px; width:2px; background:var(--ink); }
/* gantt */
.gantt{ overflow:auto; border:1px solid var(--line); border-radius:var(--r-m); max-height:calc(100vh - 260px); }
.g-row{ display:grid; grid-template-columns:300px 1fr; min-width:900px; border-bottom:1px solid var(--line); }
.g-row.head{ position:sticky; top:0; z-index:3; background:var(--surface); font-size:11.5px; color:var(--muted); }
.g-row.phase{ background:var(--surface); font-weight:600; }
.g-lbl{ padding:6px 10px; font-size:12.5px; border-right:1px solid var(--line); position:sticky; left:0; background:inherit; z-index:2; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.g-row:not(.head):not(.phase) .g-lbl{ background:var(--bg); }
.g-lbl small{ color:var(--muted); font-weight:400; }
.g-track{ position:relative; height:30px; }
.g-row.head .g-track{ height:30px; }
.g-bar{ position:absolute; top:8px; height:14px; border-radius:3px; background:color-mix(in srgb, var(--ph,var(--brand)) 28%, var(--bg)); border:1px solid var(--ph,var(--brand)); overflow:hidden; }
.g-bar span{ display:block; height:100%; background:var(--ph,var(--brand)); }
.g-today{ position:absolute; top:0; bottom:0; width:2px; background:var(--red); z-index:1; }
.g-mon{ position:absolute; top:0; bottom:0; border-left:1px solid var(--line); padding:7px 0 0 4px; white-space:nowrap; }
/* composer de reporte diario */
.sheet.wide{ width:min(860px,100%); }
.rd-top{ display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:12px; }
@media (max-width:640px){ .rd-top{ grid-template-columns:1fr 1fr; } }
.sec{ border:1px solid var(--line); border-radius:var(--r-m); }
.sec > summary{ list-style:none; cursor:pointer; display:flex; align-items:center; gap:12px; padding:13px 14px; }
.sec > summary::-webkit-details-marker{ display:none; }
.sec > summary .si{ width:34px; height:34px; border-radius:9px; background:var(--surface); display:grid; place-items:center; font-size:17px; flex:none; }
.sec > summary b{ display:block; font-size:15px; }
.sec > summary span.d{ font-size:12.5px; color:var(--muted); }
.sec > summary .cnt{ margin-left:auto; }
.sec[open] > summary{ border-bottom:1px solid var(--line); }
.sec-body{ padding:14px; display:grid; gap:12px; }
.rows{ display:grid; gap:10px; }
.rowc{ border:1px solid var(--line); border-radius:9px; padding:10px; display:grid; gap:8px; background:var(--surface); position:relative; }
.rowc .rm-row{ position:absolute; top:6px; right:6px; border:0; background:none; color:var(--muted); font-size:18px; width:28px; height:28px; border-radius:50%; }
.rowc .rm-row:hover{ background:var(--surface-2); color:var(--red); }
.fgrid{ display:grid; gap:8px; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); padding-right:26px; }
.fgrid .w2{ grid-column:span 2; }
@media (max-width:520px){ .fgrid .w2{ grid-column:auto; } }
.mini-l{ font-size:11.5px; font-weight:600; color:var(--muted); display:block; margin-bottom:3px; }
.input.sm{ padding:7px 9px; font-size:14px; }
.hint-line{ font-size:12.5px; color:var(--muted); }
.hint-line b{ color:var(--ink-2); }
.add-btn{ border:1.5px dashed var(--line-strong); background:none; border-radius:9px; padding:10px; font-weight:600; color:var(--brand); width:100%; }
.add-btn:hover{ background:var(--brand-soft); border-color:var(--brand); }
.seg.sm button{ padding:5px 10px; font-size:12.5px; }
.combo{ position:relative; }
.sugg{ position:absolute; left:0; right:0; top:100%; z-index:20; background:var(--bg); border:1px solid var(--line-strong); border-radius:9px; box-shadow:var(--shadow); max-height:260px; overflow-y:auto; margin-top:3px; }
.sugg button{ display:block; width:100%; text-align:left; border:0; background:none; padding:8px 11px; font-size:13.5px; border-bottom:1px solid var(--line); }
.sugg button:hover,.sugg button.act{ background:var(--brand-soft); }
.sugg button small{ display:block; color:var(--muted); font-size:11.5px; }
.sugg .sg-h{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); padding:7px 11px 3px; background:var(--surface); }
.hc-list{ max-height:260px; overflow-y:auto; border:1px solid var(--line); border-radius:9px; }
.hc-list label{ display:flex; gap:10px; align-items:center; padding:8px 11px; border-bottom:1px solid var(--line); cursor:pointer; font-size:13.5px; }
.hc-list label:last-child{ border-bottom:0; }
.hc-list label span{ flex:1; min-width:0; }
.hc-list label small{ color:var(--muted); display:block; font-size:12px; }
.hc-list input{ width:17px; height:17px; accent-color:var(--brand); }
.firma{ border:2px solid var(--brand); border-radius:var(--r-m); padding:14px; background:var(--brand-soft); display:grid; gap:8px; }
.firma label{ display:flex; gap:10px; align-items:flex-start; cursor:pointer; font-size:14px; }
.firma input{ width:20px; height:20px; accent-color:var(--brand); margin-top:1px; flex:none; }
.signed{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--ok); }
.draft{ display:inline-flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--amber-ink); }
/* tarjetas de reporte diario */
.rep{ border:1px solid var(--line); border-radius:var(--r-l); padding:14px 16px; margin:10px 0; background:var(--bg); }
.rep.is-signed{ border-left:4px solid var(--ok); }
.rep.is-draft{ border-left:4px solid var(--amber); }
.rep-h{ display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; }
.rep-h .folio{ font-weight:700; font-size:13px; color:var(--brand); }
.rep-h .who{ font-size:12.5px; color:var(--muted); }
.rep-stats{ display:flex; flex-wrap:wrap; gap:6px; margin:10px 0 4px; }
.rep-sec{ margin-top:10px; }
.rep-sec h5{ margin:0 0 4px; font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); }
.rep-sec ul{ margin:0; padding-left:18px; font-size:14px; color:var(--ink-2); }
.rep-sec li{ margin:2px 0; }
.ev{ border-left:3px solid var(--cat,var(--line-strong)); padding:6px 0 6px 12px; margin:8px 0; }
.ev.is-hito{ border-left-color:var(--amber); background:linear-gradient(90deg,var(--amber-soft),transparent 70%); border-radius:0 8px 8px 0; }
.ev h4{ margin:2px 0; font-size:15px; }
.ev p{ margin:2px 0 0; font-size:14px; color:var(--ink-2); white-space:pre-wrap; }
.aclar{ margin-top:8px; border:1px dashed var(--line-strong); border-radius:8px; padding:8px 10px; font-size:13px; }
.aclar b{ font-size:12px; color:var(--muted); display:block; }
/* búsqueda global */
.gsearch{ position:relative; margin-bottom:18px; }
.gsearch input{ font-size:17px; padding:14px 14px 14px 44px; border-radius:12px; }
.gsearch svg{ position:absolute; left:15px; top:50%; transform:translateY(-50%); width:20px; height:20px; color:var(--muted); }
.res-group h4{ font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:18px 0 6px; }
.res{ display:block; width:100%; text-align:left; border:1px solid var(--line); background:var(--bg); border-radius:10px; padding:10px 12px; margin-bottom:6px; }
.res:hover{ border-color:var(--brand); }
.res .r-m{ font-size:12px; color:var(--muted); }
.res .r-t{ font-size:14px; margin-top:2px; }
/* reporte imprimible */
.doc-view{ background:#fff; color:#10153A; border:1px solid var(--line); border-radius:var(--r-m); padding:32px 36px; max-width:900px; margin:0 auto; font-size:13.5px; }
.doc-view h1{ font-size:24px; margin:0; color:#0003AA; }
.doc-view h2{ font-size:15px; margin:22px 0 8px; color:#0003AA; border-bottom:2px solid #0003AA; padding-bottom:4px; text-transform:uppercase; letter-spacing:.04em; }
.doc-view .dv-meta{ display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin:14px 0; }
.doc-view .dv-meta div{ border:1px solid #DCE1E8; border-radius:6px; padding:8px 10px; }
.doc-view .dv-meta small{ display:block; color:#5B6478; font-size:11px; }
.doc-view .dv-meta b{ font-size:16px; }
.doc-view table{ width:100%; border-collapse:collapse; font-size:12.5px; }
.doc-view th{ background:#F4F6F9; text-align:left; padding:6px 8px; border:1px solid #DCE1E8; font-size:11.5px; }
.doc-view td{ padding:6px 8px; border:1px solid #DCE1E8; vertical-align:top; }
.doc-view .dv-photos{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; }
.doc-view .dv-photos img{ width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:4px; }
.doc-view .dv-sign{ margin-top:26px; display:grid; grid-template-columns:1fr 1fr; gap:30px; }
.doc-view .dv-sign div{ border-top:1px solid #10153A; padding-top:6px; font-size:12px; text-align:center; }
.doc-view .muted{ color:#5B6478; }
@media print{
  body *{ visibility:hidden !important; }
  body:not(.pm) #print-root, body:not(.pm) #print-root *, body.pm #print-modal, body.pm #print-modal *{ visibility:visible !important; }
  #print-root, #print-modal{ position:absolute; left:0; top:0; width:100%; }
  .overlay, .dialog, .sheet-body{ position:static !important; overflow:visible !important; max-height:none !important; background:#fff !important; }
  .doc-view{ border:0; padding:0; max-width:none; }
  .no-print{ display:none !important; }
}
.more-sheet{ display:grid; gap:4px; padding:10px; }
.more-sheet button{ display:flex; gap:12px; align-items:center; border:0; background:none; padding:12px; border-radius:10px; font-size:15px; text-align:left; }
.more-sheet button:hover{ background:var(--surface); }
.more-sheet svg{ width:20px; height:20px; }
.imp-box{ border:1.5px dashed var(--line-strong); border-radius:var(--r-l); padding:22px; display:grid; gap:10px; justify-items:start; }
.imp-box h3{ font-size:16px; }
.imp-box p{ margin:0; color:var(--muted); font-size:13.5px; max-width:70ch; }
.cols-ok{ font-size:12.5px; color:var(--muted); }
.cols-ok code{ background:var(--surface-2); padding:1px 5px; border-radius:4px; font-size:12px; color:var(--ink-2); }
.phase-dot{ display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; vertical-align:-1px; }
.g-main{ grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); }
@media (max-width:980px){ .g-main{ grid-template-columns:1fr; } }
.kpis.k6 .kpi:last-child{ grid-column:auto; }
.seg.sm{ flex-wrap:nowrap; }
.callout{ border-left:4px solid var(--brand); background:var(--surface); padding:12px 14px; border-radius:0 10px 10px 0; font-size:13.5px; color:var(--ink-2); margin-bottom:16px; }
.callout b{ color:var(--ink); }

/* v3: pronóstico del mes */
.prono-wrap{ max-height:calc(100vh - 220px); }

.tbl.prono th.pd.sun{ color:var(--line-strong); }
.tbl.prono td.pd:empty{ background:repeating-linear-gradient(0deg, transparent 0 100%); }
.tbl.prono .tday{ background:var(--brand-soft) !important; }

.tbl.prono th.stk{ z-index:4; background:var(--surface); }
.tbl.prono td.pd{ color:var(--ink-2); }
.spin{ margin-bottom:6px; }

#login-root:empty{ display:none; }
.login{ position:fixed; inset:0; z-index:400; background:var(--surface); display:grid; place-items:center; padding:20px; overflow:auto; }

.dotbadge{ position:absolute; top:-2px; right:-2px; width:10px; height:10px; border-radius:50%; background:var(--red); box-shadow:0 0 0 2px var(--bg); }
.cal{ display:flex; gap:2px; flex-wrap:wrap; max-width:330px; }
.cal span{ width:9px; height:14px; border-radius:2px; background:var(--surface-2); }
.cal span.ok{ background:var(--ok); } .cal span.dr{ background:var(--amber); } .cal span.no{ background:var(--red); } .cal span.na{ background:transparent; border:1px solid var(--line); }
.chip input{ accent-color:var(--brand); margin:0; }
#modal2-root .overlay{ z-index:150; }

const fmtQ = n => fmtN(n, Number(n) % 1 ? 2 : 0);
const fmtM = n => (n == null || isNaN(n)) ? '–' : (Math.abs(n) >= 1e6 ? '$' + fmtN(n / 1e6, 2) + ' M' : Math.abs(n) >= 1e3 ? '$' + fmtN(n / 1e3, 1) + ' k' : '$' + fmtN(n, 0));
const fmtP = (n, d = 0) => (n == null || isNaN(n) || !isFinite(n)) ? '–' : fmtN(n * 100, d) + '%';
const num = v => { if (v == null || v === '') return 0; if (typeof v === 'number') return v; const n = parseFloat(String(v).replace(/[$,\s]/g, '')); return isNaN(n) ? 0 : n; };
const normCh = c => c.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().charAt(0) || c;
const norm = s => String(s ?? '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase();

const clone = o => JSON.parse(JSON.stringify(o));
function hl(text, q) {
  const t = String(text ?? ''); if (!q) return esc(t);
  const nq = norm(q).trim(); if (!nq) return esc(t);
  const chars = Array.from(t); const nt = chars.map(normCh).join('');
  let out = '', i = 0, idx;
  while ((idx = nt.indexOf(nq, i)) !== -1) { out += esc(chars.slice(i, idx).join('')) + '<mark>' + esc(chars.slice(idx, idx + nq.length).join('')) + '</mark>'; i = idx + nq.length; }
  return out + esc(chars.slice(i).join(''));
}
async function sha256(txt) {
  try { const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt)); return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join(''); }

}

/* ---------- Fechas ---------- */
const pad = n => String(n).padStart(2, '0');
const iso = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const pd = s => { if (s instanceof Date) return new Date(s.getFullYear(), s.getMonth(), s.getDate()); const [y, m, d] = String(s).slice(0, 10).split('-').map(Number); return new Date(y, (m || 1) - 1, d || 1); };
const addDays = (d, n) => { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; };
const mondayOf = d => addDays(d, -((d.getDay() + 6) % 7));
const daysBetween = (a, b) => Math.round((Date.UTC(b.getFullYear(), b.getMonth(), b.getDate()) - Date.UTC(a.getFullYear(), a.getMonth(), a.getDate())) / 864e5);
const TODAY = () => pd(iso(new Date()));
function isoWeek(d) { const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())); const day = t.getUTCDay() || 7; t.setUTCDate(t.getUTCDate() + 4 - day); const y = t.getUTCFullYear(); const ys = new Date(Date.UTC(y, 0, 1)); return { y, w: Math.ceil(((t - ys) / 864e5 + 1) / 7) }; }
const mondayOfIsoWeek = (y, w) => addDays(mondayOf(new Date(y, 0, 4)), (w - 1) * 7);
const MES = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
const MES3 = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
const DIA = ['domingo', 'lunes', 'martes', 'miércoles', 'jueves', 'viernes', 'sábado'];
const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const fShort = d => `${d.getDate()} ${MES3[d.getMonth()]}`;
const fLong = d => `${cap(DIA[d.getDay()])} ${d.getDate()} de ${MES[d.getMonth()]}`;
const fFull = d => `${d.getDate()} de ${MES[d.getMonth()]} de ${d.getFullYear()}`;
const fDMY = d => `${pad(d.getDate())}/${pad(d.getMonth() + 1)}/${d.getFullYear()}`;
const fRange = (a, b) => a.getMonth() === b.getMonth() && a.getFullYear() === b.getFullYear() ? `${a.getDate()} – ${b.getDate()} ${MES3[b.getMonth()]} ${b.getFullYear()}` : `${fShort(a)} – ${fShort(b)} ${b.getFullYear()}`;
const fStamp = ts => { const d = new Date(ts); return `${fShort(d)} ${d.getFullYear()}, ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const mLabel = k => { const [y, m] = k.split('-').map(Number); return `${cap(MES[m - 1])} ${y}`; };
const isWorkday = d => d.getDay() !== 0;
function workdays(a, b) { if (b < a) return 0; const n = daysBetween(a, b) + 1; const k = (7 - a.getDay()) % 7; const sundays = k >= n ? 0 : 1 + Math.floor((n - 1 - k) / 7); return n - sundays; } // lunes a sábado
function parseDateAny(v) {
  if (v == null || v === '') return null;
  if (v instanceof Date && !isNaN(v)) return pd(v);
  if (typeof v === 'number') { const d = new Date(Math.round((v - 25569) * 864e5)); return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()); }
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if (m) return new Date(+m[1], +m[2] - 1, +m[3]);
  m = s.match(/(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/); if (m) { const y = +m[3] < 100 ? 2000 + +m[3] : +m[3]; return new Date(y, +m[2] - 1, +m[1]); }
  const mm = MES3.findIndex(x => norm(s).includes(x)); m = s.match(/(\d{1,2}).*?(\d{4})/);
  if (mm >= 0 && m) return new Date(+m[2], mm, +m[1]);
  return null;
}
function obraWeek(d) { const p = Store.doc('project'); if (!p || !p.start) return null; return Math.floor(daysBetween(mondayOf(pd(p.start)), mondayOf(d)) / 7) + 1; }
function obraWeeksTotal() { const p = Store.doc('project'); if (!p || !p.start || !p.end) return null; return Math.floor(daysBetween(mondayOf(pd(p.start)), mondayOf(pd(p.end))) / 7) + 1; }
function periodRange(period, a, custom) {
  if (period === 'dia') { const wk = isoWeek(a), ow = obraWeek(a); return { from: a, to: a, label: fLong(a), sub: `Semana ${wk.w}${ow ? ' · Semana de obra ' + ow : ''}` }; }
  if (period === 'semana') { const m = mondayOf(a), s = addDays(m, 6), wk = isoWeek(a), ow = obraWeek(a); return { from: m, to: s, label: `Semana ${wk.w}`, sub: fRange(m, s) + (ow ? ` · Obra sem. ${ow}` : '') }; }
  if (period === 'catorcena') { const wk = isoWeek(a); const c = Math.ceil(wk.w / 2); const m = mondayOfIsoWeek(wk.y, 2 * c - 1), s = addDays(m, 13); return { from: m, to: s, label: `Catorcena ${c}`, sub: `Semanas ${2 * c - 1}–${2 * c} · ${fRange(m, s)}` }; }
  if (period === 'mes') { const m = new Date(a.getFullYear(), a.getMonth(), 1), s = new Date(a.getFullYear(), a.getMonth() + 1, 0); return { from: m, to: s, label: `${cap(MES[a.getMonth()])} ${a.getFullYear()}`, sub: fRange(m, s) }; }
  if (period === 'rango') { const f = custom?.from ? pd(custom.from) : addDays(TODAY(), -30), t = custom?.to ? pd(custom.to) : TODAY(); return { from: f, to: t, label: 'Rango personalizado', sub: fRange(f, t) }; }

const IDB = {
  db: null,
  open() { return new Promise((res, rej) => { const r = indexedDB.open('bitacora-obra-v2', 1); r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('files'); }; r.onsuccess = () => { this.db = r.result; res(); }; r.onerror = () => rej(r.error); }); },
  tx(store, mode, fn) { return new Promise((res, rej) => { const t = this.db.transaction(store, mode); const req = fn(t.objectStore(store)); t.oncomplete = () => res(req && req.result); t.onerror = () => rej(t.error); }); },
  get(s, k) { return this.tx(s, 'readonly', o => o.get(k)); },
  put(s, k, v) { return this.tx(s, 'readwrite', o => o.put(v, k)); },
  async all(s) { const k = await this.tx(s, 'readonly', o => o.getAllKeys()); const v = await this.tx(s, 'readonly', o => o.getAll()); return k.map((x, i) => [x, v[i]]); }
};

const COLLS = ['reports', 'docs', 'audit', 'pend', 'equipos', 'vales', 'insp', 'obs', 'lab', 'plan'];

      const ORD = { reports: 'date', docs: 'fecha', audit: 'at', pend: 'alta', equipos: 'createdAt', vales: 'fecha', insp: 'fecha', obs: 'alta', lab: 'fecha', plan: 'semana' };
      COLLS.forEach(c => db.collection(c).orderBy(ORD[c], 'desc').limit(1000).onSnapshot(s => { this.c[c] = s.docs.map(d => Object.assign({}, d.data(), { id: d.id })); mark(c); }, () => { mark(c); toast('Se perdió la conexión con la base compartida. Recarga la página.', true); }));

  reports() { return this.cache('reports'); },

  folios() { return this.cache('folios'); },
  _folios() { const m = new Map(); this.reports().forEach((r, i) => m.set(r.id, 'BO-' + String(i + 1).padStart(3, '0'))); return m; },
  execRows() { return this.cache('execRows'); },
  _execRows() {

  },
  events() { return this.cache('events'); },
  _events() { const out = []; this.reports().forEach(r => (r.eventos || []).forEach(e => out.push(Object.assign({}, e, { date: r.date, rid: r.id, frente: r.frente, author: r.author, signed: !!r.firma })))); return out.sort((a, b) => b.date.localeCompare(a.date)); },
  hitos() { return this.events().filter(e => e.clase === 'hito'); },
  alerts() { return this.events().filter(e => e.atencion && !e.resuelta); },
  pend() { return Store.list('pend').slice().sort((a, b) => String(b.alta).localeCompare(String(a.alta))); },
  pendOpen() { return this.pend().filter(p => p.estatus !== 'Cerrado'); },
  pendLate() { const t = iso(TODAY()); return this.pendOpen().filter(p => p.compromiso && p.compromiso < t); },
  money() { return this.cache('money'); },
  _money() { return this.concepts().some(c => num(c.pu) > 0); },
  pu(clave) { const c = this.cmap().get(clave); return c ? num(c.pu) : 0; },
  ctot() { return this.cache('ctot'); },
  _ctot() { const m = {}; this.program().forEach(l => m[l.clave] = (m[l.clave] || 0) + num(l.cant)); this.concepts().forEach(c => { if (num(c.cant)) m[c.clave] = num(c.cant); }); return m; },
  conceptTotal(clave) { return this.ctot()[clave] || 0; },
  bac() { return this.cache('bac'); },
  _bac() {
    const keys = Object.keys(this.ctot());
    if (this.money()) { let s = 0; keys.forEach(k => s += this.conceptTotal(k) * this.pu(k)); return s; }
    return keys.length; // modo sin precios: cada concepto pesa lo mismo
  },
  wt(clave) { return this.money() ? this.conceptTotal(clave) * this.pu(clave) : 1; },
  lineFrac(l, t) { if (t < l._ini) return 0; if (t >= l._fin) return 1; const tot = workdays(l._ini, l._fin) || 1; return workdays(l._ini, t) / tot; },
  pvLines(lines, t) {
    if (!lines.length) return null; let s = 0;
    const tot = {}; lines.forEach(l => tot[l.clave] = (tot[l.clave] || 0) + num(l.cant));
    lines.forEach(l => { const share = tot[l.clave] ? num(l.cant) / tot[l.clave] : 0; s += this.lineFrac(l, t) * share * this.wt(l.clave); });
    return s;
  },
  pvAt(t) { return this.pvLines(this.program(), t); },
  pvBaseAt(t) { return this.baseline().length ? this.pvLines(this.baseline(), t) : null; },
  execByClave(t) { const m = {}; const ts = t ? iso(t) : null; this.execRows().forEach(x => { if (!ts || x.date <= ts) m[x.clave] = (m[x.clave] || 0) + x.qty; }); return m; },
  evAt(t) {
    const ex = this.execByClave(t); let s = 0;
    Object.entries(ex).forEach(([k, q]) => s += this.earned(k, q));
    return s;
  },
  earned(k, q) { if (this.money()) return q * this.pu(k); const tot = this.conceptTotal(k); return tot ? Math.min(q, tot) / tot : 0; },
  span() {
    const p = Store.doc('project') || {}; const prog = this.program();
    let a = p.start ? pd(p.start) : null, b = p.end ? pd(p.end) : null;
    if (prog.length) { let mi = prog[0]._ini, ma = prog[0]._fin; prog.forEach(l => { if (l._ini < mi) mi = l._ini; if (l._fin > ma) ma = l._fin; }); if (!a || mi < a) a = mi; if (!b || ma > b) b = ma; }
    return a && b ? { a, b } : null;
  },
  scurve() { return this.cache('scurve'); },
  _scurve() {
    const sp = this.span(); const bac = this.bac(); if (!sp || !bac) return null;
    const today = TODAY(); const pts = []; const hasB = this.baseline().length > 0;
    const evRows = this.execRows().slice().sort((a, b) => a.date.localeCompare(b.date)); let ei = 0; const acc = {};
    for (let m = mondayOf(sp.a); m <= addDays(mondayOf(sp.b), 6); m = addDays(m, 7)) {
      const end = addDays(m, 6); const pv = this.pvAt(end); let ev = null;
      if (m <= today) { const lim = iso(end > today ? today : end); while (ei < evRows.length && evRows[ei].date <= lim) { const x = evRows[ei++]; acc[x.clave] = (acc[x.clave] || 0) + x.qty; } let s = 0; for (const k in acc) s += this.earned(k, acc[k]); ev = s / bac; }
      pts.push({ m, end, pv: pv == null ? null : pv / bac, pvb: hasB ? this.pvBaseAt(end) / bac : null, ev });
    }
    return pts;
  },
  costOf(r) { const d = num(r.dir) + num(r.fijo); return d || num(r.cos); },
  acAt(t) { const k = `${t.getFullYear()}-${pad(t.getMonth() + 1)}`; return this.finance().filter(r => r.mes <= k).reduce((a, r) => a + this.costOf(r), 0); },
  status() { return this.cache('status'); },
  _status() {
    const bac = this.bac(); const t = TODAY(); if (!bac) return null;
    const pv = this.pvAt(t), ev = this.evAt(t);
    const res = { bac, pv, ev, pvP: pv == null ? null : pv / bac, evP: ev / bac, spi: pv ? ev / pv : null, delayDays: null };
    const sc = this.scurve();
    if (sc && pv != null) { // tiempo ganado (earned schedule): cuándo debió alcanzarse el avance real
      const evP = ev / bac; let when = null;
      for (let i = 0; i < sc.length; i++) { if (sc[i].pv != null && sc[i].pv >= evP - 1e-9) { const prev = i ? sc[i - 1] : { pv: 0, end: addDays(sc[0].m, -1) }; const span = (sc[i].pv - prev.pv) || 1; const f = Math.max(0, Math.min(1, (evP - prev.pv) / span)); when = addDays(prev.end, Math.round(f * 7)); break; } }
      if (when) res.delayDays = daysBetween(when, t);
    }
    // Valor ganado con costo real: misma convención que el EARNED VALUE del equipo (EV a precio de venta, AC = costo directo + fijo)
    const ac = this.money() ? this.acAt(t) : 0;
    if (ac > 0) {
      res.ac = ac; res.cpi = ev / ac; res.cv = ev - ac; res.sv = pv != null ? ev - pv : null;
      res.eac = bac / res.cpi; res.vac = bac - res.eac; res.tcpi = (bac - ev) / (bac - ac);
    }
    const p = Store.doc('project') || {};
    if (res.spi && p.start && p.end) { const pdur = daysBetween(pd(p.start), pd(p.end)); res.finProy = addDays(pd(p.start), Math.round(pdur / Math.max(.2, res.spi))); res.varFin = daysBetween(pd(p.end), res.finProy); }
    return res;
  },
  lines() { return this.cache('lines'); },
  _lines() { // desviación por concepto y fase
    const t = TODAY(); const out = [];
    const byClave = {}; this.program().forEach(l => (byClave[l.clave] = byClave[l.clave] || []).push(l));
    Object.values(byClave).forEach(ls => ls.sort((a, b) => a._ini - b._ini));
    const exBy = {}; this.execRows().forEach(x => (exBy[x.clave] = exBy[x.clave] || []).push(x));
    const alloc = {}; // reparte lo ejecutado a las líneas de cada concepto
    Object.entries(byClave).forEach(([k, ls]) => {
      ls.forEach(l => alloc[l.id] = 0);
      const rows = exBy[k] || []; let free = 0;
      rows.forEach(x => { const l = x.fase ? ls.find(l => norm(l.fase) === norm(x.fase)) : null; if (l) alloc[l.id] += x.qty; else free += x.qty; });
      ls.forEach(l => { const room = Math.max(0, num(l.cant) - alloc[l.id]); const take = Math.min(room, free); alloc[l.id] += take; free -= take; });
      if (free > 0 && ls.length) alloc[ls[ls.length - 1].id] += free;
    });
    this.program().forEach(l => {
      const c = this.cmap().get(l.clave) || {}; const plan = num(l.cant) * this.lineFrac(l, t); const done = alloc[l.id] || 0; const cant = num(l.cant);
      let st = 'Por iniciar';
      if (done >= cant - 1e-9 && cant > 0) st = 'Terminado'; else if (plan <= 1e-9 && done > 0) st = 'Adelantado'; else if (plan > 1e-9) { const r = done / plan; st = r < 0.9 ? 'Atrasado' : r > 1.1 ? 'Adelantado' : 'En tiempo'; }
      const pu = this.pu(l.clave);
      out.push({ id: l.id, clave: l.clave, desc: c.desc || l.desc || l.clave, partida: c.partida || 'Sin partida', cc: c.cc || '', unidad: c.unidad || l.unidad || '', fase: l.fase, ini: l._ini, fin: l._fin, cant, plan, done, dev: done - plan, devM: (done - plan) * pu, pctPlan: cant ? plan / cant : 0, pctDone: cant ? done / cant : 0, st });
    });
    return out;
  },
  partidas() {
    const g = {}; const t = TODAY(); const grp = c => c.cc || c.partida || 'Sin partida';
    const add = (p, k, v) => { g[p] = g[p] || { partida: p, bac: 0, pv: 0, ev: 0, n: 0 }; g[p][k] += v; };
    const ex = this.execByClave(t);
    this.concepts().forEach(c => { const w = this.wt(c.clave); add(grp(c), 'bac', w); add(grp(c), 'n', 1); add(grp(c), 'ev', this.earned(c.clave, ex[c.clave] || 0)); });
    const totByClave = {}; this.program().forEach(l => totByClave[l.clave] = (totByClave[l.clave] || 0) + num(l.cant));
    this.program().forEach(l => { const c = this.cmap().get(l.clave) || {}; const share = totByClave[l.clave] ? num(l.cant) / totByClave[l.clave] : 0; add(grp(c), 'pv', this.lineFrac(l, t) * share * this.wt(l.clave)); });
    return Object.values(g).sort((a, b) => b.bac - a.bac);
  },
  // Pronóstico del mes: volumen planeado del mes por concepto y fase (o el que capture el equipo) contra lo ejecutado cada día
  prono(month) {
    const y = month.getFullYear(), mo = month.getMonth(); const a = new Date(y, mo, 1), b = new Date(y, mo + 1, 0); const N = b.getDate();
    const mk = `${y}-${pad(mo + 1)}`; const ov = ((Store.doc('prono') || {})[mk]) || {};
    const rows = new Map(); const key = (c, f) => c + '|' + (f || '');
    const get = (clave, fase) => { const k = key(clave, fase); if (!rows.has(k)) { const c = this.cmap().get(clave) || {}; rows.set(k, { k, clave, fase: fase || '', desc: c.desc || clave, unidad: c.unidad || '', cc: c.cc || '', partida: c.partida || '', pu: num(c.pu), plan: 0, days: Array(N).fill(0), ejec: 0 }); } return rows.get(k); };
    this.program().forEach(l => { if (l._fin < a || l._ini > b) return; const s = l._ini > a ? l._ini : a, e = l._fin < b ? l._fin : b; const tot = workdays(l._ini, l._fin) || 1; const q = num(l.cant) * workdays(s, e) / tot; if (q > 0) get(l.clave, l.fase).plan += q; });
    const plannedFases = {}; rows.forEach(r => (plannedFases[r.clave] = plannedFases[r.clave] || []).push(r.fase));
    const ka = iso(a), kb = iso(b);
    this.execRows().forEach(x => { if (x.date < ka || x.date > kb) return; let f = x.fase; if (!f) { const pf = plannedFases[x.clave] || []; f = pf.length === 1 ? pf[0] : ''; } const r = get(x.clave, f); const d = Number(x.date.slice(8, 10)) - 1; r.days[d] += x.qty; r.ejec += x.qty; });
    // Pronóstico capturado por el equipo: por concepto ("clave|*") o por concepto y fase; si existe, manda sobre el programa
    const progTotal = [...rows.values()].reduce((s, r) => s + r.plan * (r.pu || 1), 0);
    const byClave = Object.entries(ov).filter(([k, v]) => k.endsWith('|*') && v != null && v !== '');
    if (byClave.length) {
      rows.forEach(r => { r.planCalc = r.plan; r.plan = 0; });
      byClave.forEach(([k, v]) => { const cl = k.slice(0, -2); const rs = [...rows.values()].filter(r => r.clave === cl); const tot = rs.reduce((s, r) => s + r.planCalc, 0); if (!rs.length) { const r = get(cl, ''); r.planCalc = 0; rs.push(r); } rs.forEach(r => { r.plan = tot ? num(v) * r.planCalc / tot : num(v) / rs.length; r.override = true; }); });
    }
    rows.forEach(r => { if (ov[r.k] != null && ov[r.k] !== '') { if (r.planCalc == null) r.planCalc = r.plan; r.plan = num(ov[r.k]); r.override = true; } });
    const today = TODAY(); const elapsed = today < a ? 0 : today > b ? N : today.getDate();
    let lastDay = 0; rows.forEach(r => r.days.forEach((v, i) => { if (v) lastDay = Math.max(lastDay, i + 1); }));
    return { a, b, N, mk, elapsed, lastDay, captured: byClave.length, progTotal, rows: [...rows.values()].sort((p, q) => String(p.cc).localeCompare(String(q.cc)) || String(p.clave).localeCompare(String(q.clave), 'es', { numeric: true })) };
  },
  finance() { return ((Store.doc('finance') || {}).rows || []).slice().sort((a, b) => a.mes.localeCompare(b.mes)); },
  estim() { return ((Store.doc('estim') || {}).rows || []).slice(); },
  rentas() { return ((Store.doc('rentas') || {}).rows || []).slice(); },
  hcById() { const m = new Map(); (Store.arr.hc || []).forEach(h => m.set(h.id, h)); return m; },
  headcount(r) { return (r.personal || []).length + (r.personalExtra || []).length + (r.cuadrillas || []).reduce((a, c) => a + num(c.n), 0); },
  machCount(r) { return (r.maquinaria || []).reduce((a, m) => a + (num(m.n) || 1), 0); }
};

/* ---------- Búsqueda global (expediente) ---------- */
function globalSearch(q) {
  const nq = norm(q).trim(); if (nq.length < 2) return null;
  const has = s => norm(s).includes(nq); const R = { eventos: [], pendientes: [], reportes: [], avances: [], recursos: [], documentos: [], conceptos: [] };
  const hc = M.hcById();
  M.reports().forEach(r => {
    const base = { rid: r.id, date: r.date };
    (r.eventos || []).forEach(e => { if (has(e.titulo) || has(e.texto) || has(EV[e.tipo]?.label) || (e.files || []).some(f => has(f.name))) R.eventos.push(Object.assign({}, base, { t: e.titulo || EV[e.tipo]?.label, s: e.texto, kind: e.clase === 'hito' ? '★ Hito' : EV[e.tipo]?.label })); });
    if (has(r.notas) || has(r.frente) || has(r.author?.name) || has(M.folios().get(r.id))) R.reportes.push(Object.assign({}, base, { t: `${M.folios().get(r.id)} · ${r.frente || 'Sin frente'}`, s: r.notas || '', kind: r.firma ? 'Firmado' : 'Borrador' }));
    (r.avances || []).forEach(a => { const c = M.cmap().get(a.clave); if (has(a.clave) || has(c?.desc) || has(a.desc) || has(a.nota) || has(a.fase)) R.avances.push(Object.assign({}, base, { t: `${a.clave ? a.clave + ' · ' : ''}${c?.desc || a.desc || ''}`, s: `${fmtQ(a.qty)} ${c?.unidad || a.unidad || ''}${a.fase ? ' · ' + a.fase : ''}${a.nota ? ' · ' + a.nota : ''}`, kind: 'Avance' })); });
    const people = [...(r.personal || []).map(id => hc.get(id)).filter(Boolean).map(h => h.nombre + ' ' + h.puesto), ...(r.personalExtra || []).map(p => p.nombre + ' ' + p.puesto), ...(r.cuadrillas || []).map(c => c.empresa + ' ' + c.oficio)];
    people.filter(has).forEach(p => R.recursos.push(Object.assign({}, base, { t: p, s: 'Personal en sitio', kind: 'Personal' })));
    (r.maquinaria || []).forEach(m => { const s = `${m.tipo} ${m.marca} ${m.modelo} ${m.owner} ${m.eco}`; if (has(s)) R.recursos.push(Object.assign({}, base, { t: `${m.n || 1} × ${m.tipo} ${m.marca || ''} ${m.modelo || ''}`, s: `${m.prop === 'rentada' ? 'Rentada · ' + (m.owner || 'sin propietario') : 'Propia CEMEX'}${m.horas ? ' · ' + m.horas + ' h' : ''}${m.estado ? ' · ' + m.estado : ''}`, kind: 'Maquinaria' })); });
    (r.materiales || []).forEach(m => { if (has(`${m.material} ${m.proveedor} ${m.folio}`)) R.recursos.push(Object.assign({}, base, { t: `${m.material}: ${fmtQ(m.qty)} ${m.unidad || ''}`, s: `${m.proveedor || ''}${m.folio ? ' · folio ' + m.folio : ''}`, kind: 'Material' })); });
  });
  Store.list('pend').forEach(p => { if (has(p.titulo) || has(p.tipo) || has(p.contraparte) || has(p.responsable) || (p.seg || []).some(x => has(x.texto))) R.pendientes.push({ pid: p.id, date: p.alta, t: p.titulo, s: ((p.seg || []).slice(-1)[0] || {}).texto || '', kind: `${p.tipo} · ${p.estatus}` }); });
  Store.list('obs').forEach(o => { if (has(`${o.folio} ${o.titulo} ${o.texto} ${o.responsable}`)) R.pendientes.push({ date: o.alta, t: `${o.folio} · ${o.titulo}`, s: o.texto || '', kind: `Observación de ${o.tipo.toLowerCase()} · ${o.estatus}`, pid: 'x', view: 'calidad' }); });
  Store.list('equipos').forEach(e => { const t = `${eqName(e)} ${e.placas} ${e.serie} ${e.eco} ${e.operador} ${e.owner} ${e.respName}`; if (has(t)) R.recursos.push({ date: (e.periodos || [])[0]?.ini, t: eqName(e), s: `${eqId(e)} · ${e.respName || ''} · ${eqActivo(e) ? 'activa' : 'baja'}`, kind: 'Maquinaria en obra', pid: 'x', view: 'equipos' }); });
  Store.list('vales').forEach(v => { if (has(`${v.folio} ${v.material} ${v.proveedor} ${v.remision} ${v.respName} ${v.clave}`)) R.recursos.push({ date: v.fecha, t: `${v.folio} · ${v.material} ${fmtQ(v.qty)} ${v.unidad || ''}`, s: v.tipo === 'entrada' ? `Entrada · ${v.proveedor || ''}` : `Salida a ${v.respName || ''} · ${v.frente || ''}`, kind: 'Almacén', pid: 'x', view: 'almacen' }); });
  Store.list('docs').forEach(d => { if (has(d.titulo) || has(d.tipo) || has(d.nota) || (d.files || []).some(f => has(f.name))) R.documentos.push({ did: d.id, date: d.fecha, t: d.titulo, s: d.nota || '', kind: d.tipo }); });
  M.concepts().forEach(c => { if (has(c.clave) || has(c.desc) || has(c.partida)) R.conceptos.push({ clave: c.clave, t: `${c.clave} · ${c.desc}`, s: `${c.partida} · ${fmtQ(c.cant)} ${c.unidad}`, kind: 'Catálogo' }); });
  Object.values(R).forEach(a => a.sort((x, y) => String(y.date || '').localeCompare(String(x.date || ''))));
  return R;
}

function vGantt() {

  const today = TODAY(); const tx = today >= a && today <= b ? `<span class="g-today" style="left:${x(today)}%"></span>` : '';
  const lines = M.lines(); const show = S.ganttFase ? phases.filter(p => p.name === S.ganttFase) : phases;
  return `<div class="tb-row" style="margin-bottom:12px">${phases.length > 12 ? `<select class="input" style="width:auto;max-width:320px" data-input="gfase"><option value="">Todas las fases (${phases.length})</option>${phases.map(p => `<option ${S.ganttFase === p.name ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select><span class="hint-line">${prog.length} líneas de programa</span>` : `<div class="chips"><button class="chip" data-action="gfase" data-k="" aria-pressed="${!S.ganttFase}">Todas las fases</button>${phases.map(p => `<button class="chip" data-action="gfase" data-k="${esc(p.name)}" aria-pressed="${S.ganttFase === p.name}"><span class="dot" style="background:${p.color}"></span>${esc(p.name)}</button>`).join('')}</div>`}</div>

    ${ls.map(l => `<div class="g-row" style="--ph:${ph.color}"><div class="g-lbl" title="${esc(l.clave + ' ' + l.desc)}"><b>${esc(l.clave)}</b> ${esc(l.desc)} <small>${fmtQ(l.cant)} ${esc(l.unidad)}</small></div><div class="g-track"><span class="g-bar" title="${esc(l.desc)}: ${fDMY(l.ini)} a ${fDMY(l.fin)} · ejecutado ${fmtQ(l.done)} de ${fmtQ(l.cant)} ${esc(l.unidad)}" style="left:${x(l.ini)}%;width:${Math.max(.5, x(addDays(l.fin, 1)) - x(l.ini))}%;${l.st === 'Atrasado' ? 'border-color:var(--red)' : ''}"><span style="width:${Math.min(100, l.pctDone * 100)}%"></span></span>${tx}</div></div>`).join('')}`; }).join('')}

    ${k('Programado a hoy (PV)', st?.pvP != null ? fmtP(st.pvP, 1) : '–', money && st?.pv != null ? fmtM(st.pv) : 'valor planeado', st?.pvP != null ? '' : 'ph-v')}

    ${k('CPI', st?.cpi != null ? fmtN(st.cpi, 2) : '–', st?.cv != null ? `CV ${fmtM(st.cv)}` : 'EV ÷ AC', st?.cpi == null ? 'ph-v' : st.cpi >= 1 ? 'good' : 'bad', 'Índice de desempeño del costo: valor ganado (a precio de venta) entre costo real, igual que el EARNED VALUE del equipo. Arriba de 1 hay margen.')}
    ${k('Término proyectado', st?.finProy ? `${fShort(st.finProy)} ${st.finProy.getFullYear()}` : '–', st?.varFin != null ? (st.varFin > 0 ? `${st.varFin} días después del contractual` : `${-st.varFin} días antes del contractual`) : 'al SPI actual', st?.finProy ? (st.varFin > 0 ? 'warn' : 'good') : 'ph-v', 'Fecha de término si se mantiene el ritmo actual (duración ÷ SPI).')}

  <div class="card"><h3>${st?.spi != null ? (st.spi >= .97 ? 'El avance real va en línea con el programa vigente' : `El avance real va ${fmtN((st.pvP - st.evP) * 100, 1)} puntos debajo del programa vigente`) : 'Curva S del proyecto'}</h3><div class="sub">Avance acumulado por semana (%). Programa vigente, línea base contractual (si existe), real y proyección al ritmo actual.</div>

  const F = ['todos', 'Atrasado', 'En tiempo', 'Adelantado', 'Por iniciar', 'Terminado'];
  const cnt = k => all.filter(l => l.st === k).length;

    <select class="input" style="width:auto" data-input="devfase"><option value="">Todas las fases</option>${phases.map(p => `<option ${S.devFase === p.name ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}</select></div>
  <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Clave</th><th>Concepto</th><th>Fase</th><th>Fechas</th><th class="n">Cantidad fase</th><th class="n">Prog. a hoy</th><th class="n">Ejecutado</th><th style="width:120px">Real vs prog.</th><th class="n">Desviación</th>${M.money() ? '<th class="n">Desv. $</th>' : ''}<th>Estado</th></tr></thead><tbody>
  ${list.slice(0, 500).map(l => `<tr class="click" data-action="dev-open" data-k="${esc(l.clave)}"><td><b>${esc(l.clave)}</b></td><td style="min-width:260px">${esc(l.desc.length > 110 ? l.desc.slice(0, 108) + '…' : l.desc)}<br><span class="hint-line">${esc(l.cc || '')}</span></td><td style="white-space:nowrap"><span class="phase-dot" style="background:${M.phaseColor(l.fase)}"></span>${esc(l.fase)}</td><td class="hint-line" style="white-space:nowrap">${fShort(l.ini)} – ${fShort(l.fin)}</td><td class="n">${fmtQ(l.cant)} ${esc(l.unidad)}</td><td class="n">${fmtQ(Math.round(l.plan * 100) / 100)}</td><td class="n">${fmtQ(l.done)}</td><td><div class="bar-in"><span style="width:${Math.min(100, l.pctDone * 100)}%;${l.st === 'Atrasado' ? 'background:var(--red)' : ''}"></span><i style="left:${Math.min(100, l.pctPlan * 100)}%"></i></div><span class="hint-line">${fmtP(l.pctDone)} de ${fmtP(l.pctPlan)}</span></td><td class="n" style="color:${l.dev < -1e-6 ? 'var(--red)' : 'inherit'}">${fmtQ(Math.round(l.dev * 100) / 100)}</td>${M.money() ? `<td class="n" style="color:${l.devM < -1e-6 ? 'var(--red)' : 'inherit'}">${fmtM(l.devM)}</td>` : ''}<td>${pill(l.st)}</td></tr>`).join('')}

}

let CHARTS = [];

const cssVar = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();

function drawCharts() {

const ALIAS = {
  clave: ['clave', 'codigo', 'cod', 'clave concepto', 'clave del concepto', 'id concepto'], partida: ['partida', 'capitulo', 'grupo', 'especialidad', 'subpartida'],
  desc: ['descripcion', 'concepto', 'actividad', 'descripcion del concepto', 'nombre de tarea', 'tarea'], unidad: ['unidad', 'u', 'um', 'ud', 'unid'],
  cant: ['cantidad', 'cant', 'volumen', 'cantidad total', 'cantidad fase'], pu: ['pu', 'p u', 'precio unitario', 'precio', 'p unitario'], importe: ['importe', 'total', 'monto'],
  cc: ['centro de costos', 'centro costos', 'cc', 'zona'], fase: ['fase', 'etapa', 'faseo', 'fase de obra'], ini: ['inicio', 'fecha inicio', 'comienzo', 'fecha de inicio', 'start'], fin: ['fin', 'fecha fin', 'termino', 'fecha de termino', 'finish', 'final', 'fecha final'],
  nombre: ['nombre', 'nombre completo', 'empleado', 'colaborador'], puesto: ['puesto', 'posicion', 'cargo', 'categoria'], rolp: ['rol en plataforma', 'rol plataforma', 'acceso a plataforma', 'rol'], frentes: ['frentes', 'frente', 'frente asignado', 'frentes a su cargo'], empresa: ['empresa', 'area', 'compania', 'departamento'], num: ['no empleado', 'numero de empleado', 'num empleado', 'nomina', 'no de empleado', 'numero empleado'],
  mes: ['mes', 'periodo'], ingPpto: ['ingreso ppto', 'ingreso presupuesto', 'venta ppto', 'ingresos ppto'], cosPpto: ['costo ppto', 'costo presupuesto', 'costos ppto'], ing: ['ingreso real', 'ingreso', 'venta real', 'ventas', 'ingresos'], cos: ['costo real', 'costo', 'costos'], dep: ['depreciacion', 'depreciacion real']
};
const nh = s => norm(s).replace(/[^a-z0-9 ]/g, ' ').replace(/\s+/g, ' ').trim();
async function parseSheet(file, keys) {
  if (!window.XLSX) throw new Error('No cargó el lector de Excel; revisa tu conexión.');
  const buf = await file.arrayBuffer(); const wb = XLSX.read(buf, { type: 'array', cellDates: true });
  let best = null;
  for (const sn of wb.SheetNames) {
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[sn], { header: 1, raw: true, defval: '' });
    for (let r = 0; r < Math.min(rows.length, 30); r++) {
      const hdr = rows[r].map(nh); const map = {};
      keys.forEach(k => { let i = hdr.findIndex(h => ALIAS[k].includes(h)); if (i < 0) i = hdr.findIndex(h => h && ALIAS[k].some(a => a.length > 3 && h.startsWith(a))); if (i >= 0 && !Object.values(map).includes(i)) map[k] = i; });
      const score = Object.keys(map).length; if (score >= 2 && (!best || score > best.score)) best = { score, map, rows: rows.slice(r + 1), sheet: sn };
    }
  }
  if (!best) throw new Error('No encontré los encabezados esperados. Usa la plantilla como guía.');
  return { sheet: best.sheet, map: best.map, rows: best.rows.filter(row => row.some(v => v !== '' && v != null)).map(row => { const o = {}; Object.entries(best.map).forEach(([k, i]) => o[k] = row[i]); return o; }) };
}

      if (adv && adv.cat.length) {
        if (M.concepts().length && !await ask(`Se reemplazará el catálogo actual (${M.concepts().length} conceptos) por ${adv.cat.length} conceptos de “${adv.sheet}”. Lo capturado en bitácora se conserva. ¿Continuar?`)) return;

      }

      let lastPart = 'Sin partida'; const cat = []; const prog = [];

      toast('Cargando catálogo…'); await Store.setArr('catalog', cat);
      if (prog.length) await Store.setArr('program', prog);
      await Store.log('cargó catálogo', file.name, `${cat.length} conceptos${prog.length ? ', ' + prog.length + ' líneas de programa' : ''}`);
      toast(`Catálogo cargado: ${cat.length} conceptos en ${new Set(cat.map(c => c.partida)).size} partidas${dup ? ` (${dup} claves repetidas)` : ''}${prog.length ? ` y ${prog.length} líneas de programa` : ''}.`);
